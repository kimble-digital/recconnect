<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RecConnect · Brand assets</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{ --acc:#2dd4bf; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a0b0f;color:#fff;font-family:'Inter',system-ui,sans-serif;padding:0 56px 90px;}
  header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(45,212,191,.25);padding:30px 0 20px;margin-bottom:8px;}
  header h1{font-family:'Anton';text-transform:uppercase;letter-spacing:.01em;font-size:40px;font-weight:400;}
  header p{color:#9aa3b2;font-size:13px;margin-top:6px;max-width:680px;line-height:1.5;}
  .studio-link{position:absolute;top:34px;right:0;font-family:'Bebas Neue';letter-spacing:.1em;text-transform:uppercase;font-size:16px;color:var(--acc);text-decoration:none;border:1px solid rgba(45,212,191,.4);border-radius:8px;padding:8px 16px;transition:all .15s;}
  .studio-link:hover{background:var(--acc);color:#08322c;border-color:var(--acc);}
  section{margin-top:46px;}
  section>h2{font-family:'Bebas Neue';text-transform:uppercase;letter-spacing:.14em;font-size:28px;color:var(--acc);border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:10px;margin-bottom:26px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px;}
  .card{border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;background:#101216;}
  .prev{display:flex;align-items:center;justify-content:center;padding:38px 28px;min-height:150px;}
  .prev.light{background:#ffffff;}
  .prev.dark{background:#0a0b0f;background-image:radial-gradient(circle at 50% 40%, #14171d, #0a0b0f 70%);}
  .prev img{max-width:100%;max-height:96px;height:auto;}
  .card.icon .prev img{max-height:120px;}
  .meta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);}
  .meta .name{font-size:14px;font-weight:500;}
  .meta .bg{font-family:'Bebas Neue';letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#7c8694;margin-top:2px;}
  .dl{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:190px;}
  .dl a{font-family:'Bebas Neue';letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--acc);text-decoration:none;border:1px solid rgba(45,212,191,.4);border-radius:7px;padding:6px 12px;transition:all .15s;}
  .dl a:hover{background:var(--acc);color:#08322c;border-color:var(--acc);}
</style>
</head>
<body>
  <header>
    <a href="/socials/" class="studio-link">&larr; Social studio</a>
    <h1>RecConnect · Brand assets</h1>
    <p>The RecConnect logo and icon, each shown on the background it is made for. Download the vector (SVG) for print and design, or a high-resolution transparent PNG for quick use.</p>
  </header>

  <div id="grid"></div>

  <section>
    <h2>Social templates</h2>
    <div class="grid">
      <figure class="card">
        <a href="/socials/linkedin-banner.html" target="_blank" rel="noopener" class="prev dark" style="text-decoration:none;flex-direction:column;gap:9px;">
          <span style="font-family:'Anton';text-transform:uppercase;font-size:24px;color:#fff;line-height:1;">Connect. Grow. <span style="color:var(--acc);">Get Results.</span></span>
          <span style="font-family:'Bebas Neue';letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:#7c8694;">LinkedIn company banner</span>
        </a>
        <div class="meta">
          <div>
            <div class="name">LinkedIn company banner</div>
            <div class="bg">Displays 1128&times;191 &middot; exports 4200&times;700</div>
          </div>
          <div class="dl">
            <a href="/socials/linkedin-banner.html" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
      </figure>
      <figure class="card">
        <a href="/socials/email-signature.html" target="_blank" rel="noopener" class="prev dark" style="text-decoration:none;flex-direction:column;gap:9px;">
          <span style="font-family:'Anton';text-transform:uppercase;font-size:22px;color:#fff;line-height:1;">Email <span style="color:var(--acc);">signature</span></span>
          <span style="font-family:'Bebas Neue';letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:#7c8694;">Simon Lewis &middot; HTML</span>
        </a>
        <div class="meta">
          <div>
            <div class="name">Email signature</div>
            <div class="bg">Copy &amp; paste &middot; CONNECTED promo built in</div>
          </div>
          <div class="dl">
            <a href="/socials/email-signature.html" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
      </figure>
    </div>
  </section>

  <script>
    const BASE = '/images/logos/';
    const GROUPS = [
      { key:'full', label:'Full logo' },
      { key:'icon', label:'Icon' },
    ];
    // bg: which background the variant is designed for
    const CARDS = [
      { group:'full', file:'recconnect-full-colour',     name:'Colour',            bg:'light', avatar:true },
      { group:'full', file:'recconnect-full-black',      name:'Black',             bg:'light', avatar:true },
      { group:'full', file:'recconnect-full-white',      name:'White (reversed)',  bg:'dark', avatar:true },
      { group:'full', file:'recconnect-full-colour-rev', name:'Colour (reversed)', bg:'dark', avatar:true },

      { group:'icon', file:'recconnect-mark-colour',     name:'Colour',            bg:'light', avatar:true },
      { group:'icon', file:'recconnect-mark-black',      name:'Black',             bg:'light', avatar:true },
      { group:'icon', file:'recconnect-mark-white',      name:'White (reversed)',  bg:'dark', avatar:true },
      { group:'icon', file:'recconnect-mark-colour-rev', name:'Colour (reversed)', bg:'dark', avatar:true },
    ];

    document.getElementById('grid').innerHTML = GROUPS.map(g => {
      const items = CARDS.filter(c => c.group === g.key);
      const cards = items.map(c => `
        <figure class="card ${g.key}">
          <div class="prev ${c.bg}"><img src="${BASE}${c.file}.svg" alt="RecConnect ${g.label} ${c.name}" /></div>
          <div class="meta">
            <div>
              <div class="name">${c.name}</div>
              <div class="bg">${c.bg === 'light' ? 'For light backgrounds' : 'For dark backgrounds'}</div>
            </div>
            <div class="dl">
              <a href="${BASE}${c.file}.svg" download>SVG</a>
              <a href="${BASE}${c.file}.png" download>PNG</a>
              ${c.avatar ? `<a href="${BASE}${c.file}-square.png" download title="On a black square">Square</a>
              <a href="${BASE}${c.file}-circle.png" download title="On a black circle">Circle</a>` : ''}
            </div>
          </div>
        </figure>`).join('');
      return `<section><h2>${g.label}</h2><div class="grid">${cards}</div></section>`;
    }).join('');
  </script>
</body>
</html>
